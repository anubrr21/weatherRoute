services:
  - type: web
    name: weatherroute-backend
    runtime: node
    buildCommand: npm install && npm run build
    startCommand: cd backend && npm start
    envVars:
      - key: NODE_VERSION
        value: 20.19.0
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENWEATHER_API_KEY
        sync: false
      - key: MAPBOX_ACCESS_TOKEN
        sync: false
      - key: FRONTEND_URL
        value: https://weatherroute-frontend-9y5l.onrender.com
      - key: CORS_ORIGIN
        value: https://weatherroute-frontend-9y5l.onrender.com
      - key: IRCTC_API_KEY
        sync: false
      - key: IRCTC_API_HOST
        value: irctc1.p.rapidapi.com
      - key: FLIGHTERA_API_KEY
        sync: false
      - key: FLIGHTERA_API_HOST
        value: flightera-flight-data.p.rapidapi.com
      - key: AVIATIONSTACK_API_KEY
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
      - key: BACKEND_URL
        value: https://weatherroute-backend-dkhl.onrender.com